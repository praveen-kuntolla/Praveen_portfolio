[build]
  command = "npm run verify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify automatically installs its current OpenNext adapter for Next.js.
# Keep the normal Next build: upload route handlers require server support.
[dev]
  command = "npm run dev"
  targetPort = 3001
  port = 8888
  framework = "next"
